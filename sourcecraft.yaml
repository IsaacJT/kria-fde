name: kria-fde # you probably want to 'snapcraft register <name>'
base: ubuntu@24.04 # the base snap is the execution environment for this snap
version: "2025.1" # just for humans, typically '1.2+git' or '1.3.2'
summary: Single-line elevator pitch for your amazing snap # 79 char long summary
description: |
  This is my-snap's description. You have a paragraph or two to tell the
  most important story about your snap. Keep it under 100 words though,
  we live in tweetspace and your description wants to look good in the snap
  store.
platforms:
  arm64:
    build-on:
      - amd64
parts:
  microblaze-toolchain:
    plugin: nil
    source: https://github.com/crosstool-ng/crosstool-ng.git
    source-type: git
    source-tag: crosstool-ng-1.28.0
    build-packages:
      - build-essential
      - autoconf
      - automake
      - libtool-bin
      - bison
      - flex
      - gperf
      - gawk
      - texinfo
      - help2man
      - libncurses5-dev
      - gettext
      - unzip
      - patch
      - rsync
      - wget
      - curl
      - git
      - python3
      - python3-dev
      - xz-utils
      - bzip2
    override-build: |
      ./bootstrap
      ./configure --enable-local
      make -j

      cat > .config << EOF
      CT_CONFIG_VERSION="4"
      CT_EXPERIMENTAL=y
      CT_ALLOW_BUILD_AS_ROOT=y
      CT_ALLOW_BUILD_AS_ROOT_SURE=y
      CT_ARCH_MICROBLAZE=y
      CT_ARCH_LE=y
      # CT_ARCH_USE_MMU is not set
      CT_TARGET_VENDOR="xilinx"
      CT_LIBC_NEWLIB=y
      CT_LIBC_NEWLIB_IO_C99FMT=y
      CT_LIBC_NEWLIB_IO_LL=y
      CT_LIBC_NEWLIB_IO_FLOAT=y
      CT_LIBC_NEWLIB_IO_LDBL=y
      CT_CC_LANG_CXX=y
      CT_LOCAL_TARBALLS_DIR="${CRAFT_PART_BUILD}/tarballs"
      CT_WORK_DIR="${CRAFT_PART_BUILD}/.build"
      CT_PREFIX_DIR="${CRAFT_PART_INSTALL}/microblaze-toolchain"
      EOF

      # Expand the fragment above into a full .config, accepting upstream
      # defaults for everything not set explicitly. `yes` gets SIGPIPE once
      # oldconfig stops reading, so tolerate that with `|| true`.
      yes "" | ./ct-ng oldconfig || true

      ./ct-ng build.$(nproc)
    stage:
      - microblaze-toolchain/
    prime:
      - -*
  arm-toolchain:
    plugin: nil
    source: https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-elf.tar.xz
    source-type: tar
    override-build: |
      # Install the prebuilt toolchain
      mkdir -p ${CRAFT_PART_INSTALL}/toolchain
      cp -r * ${CRAFT_PART_INSTALL}/toolchain/

      # Create symlinks in a standard location
      mkdir -p ${CRAFT_PART_INSTALL}/bin
      cd ${CRAFT_PART_INSTALL}/bin
      for tool in ${CRAFT_PART_INSTALL}/toolchain/bin/aarch64-none-elf-*; do
        ln -sf "$tool" "$(basename $tool)"
      done
    stage:
      - toolchain/
      - bin/
    prime:
      - -*
  ###################### END OF TOOLCHAIN SETUP ###############################
  fsbl:
    after:
      - arm-toolchain
    plugin: nil
    source: https://github.com/Xilinx/embeddedsw.git
    source-branch: xlnx_rel_v2026.1.1
    build-environment:
      - PATH: "${CRAFT_STAGE}/bin:${PATH}"
    override-build: |
      cd lib/sw_apps/zynqmp_fsbl/src/
      make clean
      make BOARD=som PROC=a53 A53_STATE=64 -j1

      # Install the built FSBL
      install -Dm0644 fsbl.elf -t ${CRAFT_PART_INSTALL}/blobs
    prime:
      - -*
  pmu-firmware:
    after:
      - microblaze-toolchain
    plugin: nil
    source: https://github.com/Xilinx/embeddedsw.git
    source-tag: xilinx_v2026.1
    build-environment:
      - PATH: "${CRAFT_STAGE}/microblaze-toolchain/bin:${PATH}"
      - MB_GNU: "${CRAFT_STAGE}/microblaze-toolchain"
    override-build: |
      # Find the actual MicroBlaze compiler
      MB_COMPILER=$(find ${CRAFT_STAGE}/microblaze-toolchain/bin -name "microblaze*-gcc" | head -1)
      if [ -z "$MB_COMPILER" ]; then
        echo "ERROR: Could not find MicroBlaze compiler!"
        exit 1
      fi

      # Extract the toolchain prefix
      MB_PREFIX=$(basename $MB_COMPILER | sed 's/-gcc$//')
      echo "Found MicroBlaze toolchain: $MB_PREFIX"

      # Test the compiler
      $MB_COMPILER --version || (echo "MicroBlaze GCC test failed!" && exit 1)

      # Build PMU firmware
      cd lib/sw_apps/zynqmp_pmufw/src/

      # Clean any previous builds
      make clean || true

      # crosstool-NG installs a single self-contained toolchain prefix, with
      # the newlib sysroot living at <prefix>/<target-triplet> (e.g.
      # microblazeel-xilinx-elf), unlike Buildroot's separate host/staging
      # split - so there's no need to guess between multiple locations here.
      SYSROOT="${CRAFT_STAGE}/microblaze-toolchain/${MB_PREFIX}"

      echo "Using sysroot: $SYSROOT"

      # Build with our crosstool-NG toolchain using full names and proper sysroot
      make COMPILER=${MB_PREFIX}-gcc \
           ARCHIVER=${MB_PREFIX}-ar \
           CC=${MB_PREFIX}-gcc \
           CFLAGS="-Os -flto --sysroot=${SYSROOT}" \
           -j

      # Verify the build output
      if [ ! -f executable.elf ]; then
        echo "ERROR: PMU firmware build failed - executable.elf not found"
        exit 1
      fi

      # Install the firmware
      install -D -m 0644 executable.elf ${CRAFT_PART_INSTALL}/blobs/pmufw.elf
      echo "PMU firmware built and installed successfully"
    prime:
      - -*
  arm-trusted-firmware:
    plugin: nil
    source: https://github.com/Xilinx/arm-trusted-firmware.git
    source-type: git
    source-tag: xlnx-rebase-v2.14_2026.1
    build-packages:
      - crossbuild-essential-arm64
    build-environment:
      - PLAT: "zynqmp"
      - RESET_TO_BL31: "1"
      - RESET_TO_BL2: "0"
      - ZYNQMP_CONSOLE: "cadence1"
      - PRELOADED_BL33_BASE: "0x8000000"
      - SPD: "opteed"
    override-build: |
      make PLAT=${PLAT} \
        SPD=${SPD} \
        ZYNQMP_CONSOLE=${ZYNQMP_CONSOLE} \
        RESET_TO_BL31=${RESET_TO_BL31} \
        RESET_TO_BL2=${RESET_TO_BL2} \
        PRELOADED_BL33_BASE=${PRELOADED_BL33_BASE} \
        bl31 -j
      install -Dm0644 build/${PLAT}/release/bl31/bl31.elf \
        ${CRAFT_PART_INSTALL}/blobs/arm-trusted-firmware.elf
    prime:
      - -*
  optee-uc-fde:
    plugin: dump
    source: https://github.com/canonical/optee-uc-fde.git
    source-type: git
    source-branch: master
    organize:
      '*': optee-fde/
    prime:
      - -*
  optee-os:
    plugin: nil
    source: https://github.com/Xilinx/optee_os.git
    source-type: git
    source-tag: xlnx-rebase-v4.9.0_2026.1
    after:
      - optee-uc-fde
    build-packages:
      - python3-cryptography
      - python3-pyelftools
      - uuid-dev
      - gcc-arm-linux-gnueabihf
      - gcc-${CRAFT_ARCH_TRIPLET_BUILD_FOR}
    build-environment:
      - PLATFORM: zynqmp-kr260
      - CFG_ARM64_core: y
      - CFG_RPMB_FS: n
      - CFG_USER_TA_TARGETS: "ta_arm64"
      - CFG_EARLY_TA: "y"
      - CFG_IN_TREE_EARLY_TAS: "fde_key_handler/fd1b2a86-3668-11eb-adc1-0242ac120002 pkcs11/fd02c9da-306c-48c7-a49c-bbd827ae86ee"
      # The default memory regions are huge (256 MiB) on ZynqMP; set them to a more reasonable size
      - CFG_TZDRAM_START: "0x60000000"
      - CFG_TZDRAM_SIZE: "0x02000000"
      - CFG_SHMEM_START: "0x62000000"
      - CFG_SHMEM_SIZE: "0x00400000"
    override-build: |
      cp -r ${CRAFT_STAGE}/optee-fde/ta/fde_key_handler ${CRAFT_PART_BUILD}/ta/
      make -j
      install -Dm0644 ${CRAFT_PART_BUILD}/out/arm-plat-zynqmp/core/tee-raw.bin \
                         ${CRAFT_PART_INSTALL}/blobs/tee.bin
    prime:
      - -*
  u-boot:
    plugin: nil
    source: https://github.com/Xilinx/u-boot-xlnx.git
    source-branch: xlnx_rebase_v2026.01
    source-type: git
    build-packages:
      - crossbuild-essential-arm64
      - bc
      - bison
      - flex
      - swig
      - libgnutls28-dev
      - libssl-dev
      - uuid-dev
      - device-tree-compiler
    build-environment:
      - ARCH: "arm"
      - CROSS_COMPILE: "${CRAFT_ARCH_TRIPLET_BUILD_FOR}-"
      - DEVICE_TREE: "zynqmp-smk-k26-revA-sck-kr-g-revB"
    override-build: |
      make xilinx_zynqmp_kria_defconfig
      make DEVICE_TREE=${DEVICE_TREE} \
           LOCALVERSION="-snap-${CRAFT_PROJECT_VERSION}[itrue]" \
           -j u-boot.elf u-boot.dtb
      install -Dm0644 u-boot.elf u-boot.dtb -t ${CRAFT_PART_INSTALL}/blobs
    prime:
      - -*
  bootgen:
    plugin: nil
    source: https://github.com/Xilinx/bootgen.git
    source-type: git
    source-branch: xlnx_rel_v2026.1
    override-build: |
      make -j
      install -Dm0755 build/bin/bootgen -t ${CRAFT_PART_INSTALL}
    prime:
      - -*
  boot-bin-version-header:
    plugin: nil
    build-packages:
      - git
      - xxd
    override-build: |
      echo "${CRAFT_PROJECT_VERSION}-$(git -C ${CRAFT_PROJECT_DIR} describe --always)-snap" | \
        xxd -p > boot-bin-version-header.txt
      install -Dm0644 boot-bin-version-header.txt -t ${CRAFT_PART_INSTALL}/blobs
    prime:
      - -*
  boot-bin:
    after:
      - bootgen
      - fsbl
      - arm-trusted-firmware
      - optee-os
      - u-boot
      - pmu-firmware
    plugin: nil
    source: bootgen
    override-build: |
      cp ${CRAFT_STAGE}/blobs/* ${CRAFT_PART_BUILD}/
      ${CRAFT_STAGE}/bootgen -w -image bootgen.bif -arch zynqmp -o ${CRAFT_PART_INSTALL}/BOOT.bin
    prime:
      - BOOT.bin
