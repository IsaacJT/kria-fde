name: kria-fde # you probably want to 'snapcraft register <name>'
base: ubuntu@24.04 # the base snap is the execution environment for this snap
version: '2025.1' # just for humans, typically '1.2+git' or '1.3.2'
summary: Single-line elevator pitch for your amazing snap # 79 char long summary
description: |
  This is my-snap's description. You have a paragraph or two to tell the
  most important story about your snap. Keep it under 100 words though,
  we live in tweetspace and your description wants to look good in the snap
  store.
platforms:
  arm64:
    build-on: [amd64]
    build-for: [arm64]
# prebuilt bins: https://github.com/Xilinx/embpf-bootfw-update-tool/releases/tag/v3.0
# following: https://xilinx-wiki.atlassian.net/wiki/spaces/A/pages/18842156/Fetch+Sources
package-repositories:
  - type: apt
    ppa: snappy-dev/image
parts:
  microblaze-toolchain:
    # Builds a MicroBlaze little-endian bare-metal (newlib) GCC toolchain
    # using crosstool-NG. crosstool-NG produces one self-contained,
    # relocatable toolchain prefix (bin/, <target>/include, <target>/lib),
    # unlike Buildroot which splits host tools and the newlib sysroot across
    # output/host and output/staging - the latter was never being copied,
    # which is why pmu-firmware's build used to fail with missing headers
    # like reent.h.
    #
    # Note: crosstool-NG marks MicroBlaze support as EXPERIMENTAL and does
    # not ship a maintained sample config for it, so the target is
    # configured here from scratch (mirroring the minimal fragments used by
    # crosstool-NG's own samples) rather than via `ct-ng <sample>`.
    plugin: nil
    source: https://github.com/crosstool-ng/crosstool-ng.git
    source-type: git
    source-tag: crosstool-ng-1.28.0
    build-packages:
      - build-essential
      - autoconf
      - automake
      - libtool-bin
      - bison
      - flex
      - gperf
      - gawk
      - texinfo
      - help2man
      - libncurses5-dev
      - gettext
      - unzip
      - patch
      - rsync
      - wget
      - curl
      - git
      - python3
      - python3-dev
      - xz-utils
      - bzip2
    override-build: |
      ./bootstrap
      ./configure --enable-local
      make -j$(nproc)

      cat > .config << EOF
      CT_CONFIG_VERSION="4"
      CT_EXPERIMENTAL=y
      CT_ALLOW_BUILD_AS_ROOT=y
      CT_ALLOW_BUILD_AS_ROOT_SURE=y
      CT_ARCH_MICROBLAZE=y
      CT_ARCH_LE=y
      # CT_ARCH_USE_MMU is not set
      CT_TARGET_VENDOR="xilinx"
      CT_LIBC_NEWLIB=y
      CT_LIBC_NEWLIB_IO_C99FMT=y
      CT_LIBC_NEWLIB_IO_LL=y
      CT_LIBC_NEWLIB_IO_FLOAT=y
      CT_LIBC_NEWLIB_IO_LDBL=y
      CT_CC_LANG_CXX=y
      CT_LOCAL_TARBALLS_DIR="${CRAFT_PART_BUILD}/tarballs"
      CT_WORK_DIR="${CRAFT_PART_BUILD}/.build"
      CT_PREFIX_DIR="${CRAFT_PART_INSTALL}/microblaze-toolchain"
      EOF

      # Expand the fragment above into a full .config, accepting upstream
      # defaults for everything not set explicitly. `yes` gets SIGPIPE once
      # oldconfig stops reading, so tolerate that with `|| true`.
      yes "" | ./ct-ng oldconfig || true

      ./ct-ng build.$(nproc)
    stage:
      - microblaze-toolchain/
    prime:
      - -*
  arm-toolchain:
    plugin: nil
    source: https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-elf.tar.xz
    source-type: tar
    override-build: |
      # Install the prebuilt toolchain
      mkdir -p ${CRAFT_PART_INSTALL}/toolchain
      cp -r * ${CRAFT_PART_INSTALL}/toolchain/

      # Create symlinks in a standard location
      mkdir -p ${CRAFT_PART_INSTALL}/bin
      cd ${CRAFT_PART_INSTALL}/bin
      for tool in ${CRAFT_PART_INSTALL}/toolchain/bin/aarch64-none-elf-*; do
        ln -sf "$tool" "$(basename $tool)"
      done
    stage:
      - toolchain/
      - bin/
    prime:
      - -*
  ###################### END OF TOOLCHAIN SETUP ###############################
  blobs:
    plugin: dump
    source: .
    build-packages:
      - xxd
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/prebuilt
      mkdir -p ${CRAFT_PART_INSTALL}/blobs
      cp extras/bins/* ${CRAFT_PART_INSTALL}/prebuilt/
      echo "${CRAFT_PROJECT_VERSION}-$(git describe --always)-snap" | xxd -p > ${CRAFT_PART_INSTALL}/blobs/bootbin-version-header.txt
    prime:
      - -*
  fsbl:
    after:
      - arm-toolchain
    plugin: nil
    source: https://github.com/Xilinx/embeddedsw.git
    source-tag: xilinx_v2025.1_update1
    build-environment:
      - PATH: '${CRAFT_STAGE}/bin:${PATH}'
      - PROC: 'a53'
      - BOARD: 'som'
      - A53_STATE: '64'
    override-build: |
      # Copy psu_init files to som directory
      cp ${CRAFT_PROJECT_DIR}/extras/psu_init.c lib/sw_apps/zynqmp_fsbl/misc/som/
      cp ${CRAFT_PROJECT_DIR}/extras/psu_init.h lib/sw_apps/zynqmp_fsbl/misc/som/

      # Switch to traditional make build as CMake seems to have issues
      cd lib/sw_apps/zynqmp_fsbl/src/

      make clean
      make BOARD=som \
           CROSS_COMPILE=aarch64-none-elf- \
           CFLAGS+=-DFSBL_DEBUG_INFO \
           -j$(nproc)

      # Install the built FSBL
      install -D -m 0644 fsbl.elf ${CRAFT_PART_INSTALL}/blobs/fsbl.elf
    stage:
      - blobs/fsbl.elf
    prime:
      - -*
  pmu-firmware:
    after:
      - microblaze-toolchain
    plugin: nil
    source: https://github.com/Xilinx/embeddedsw.git
    source-tag: xilinx_v2025.1_update1
    build-environment:
      - PATH: '${CRAFT_STAGE}/microblaze-toolchain/bin:${PATH}'
      - MB_GNU: '${CRAFT_STAGE}/microblaze-toolchain'
    override-build: |
      # TODO: skip pmu-firmware build for now
      exit 0
      # Find the actual MicroBlaze compiler
      MB_COMPILER=$(find ${CRAFT_STAGE}/microblaze-toolchain/bin -name "microblaze*-gcc" | head -1)
      if [ -z "$MB_COMPILER" ]; then
        echo "ERROR: Could not find MicroBlaze compiler!"
        exit 1
      fi

      # Extract the toolchain prefix
      MB_PREFIX=$(basename $MB_COMPILER | sed 's/-gcc$//')
      echo "Found MicroBlaze toolchain: $MB_PREFIX"

      # Test the compiler
      $MB_COMPILER --version || (echo "MicroBlaze GCC test failed!" && exit 1)

      # Build PMU firmware
      cd lib/sw_apps/zynqmp_pmufw/src/

      # Clean any previous builds
      make clean || true

      # Find the sysroot for the toolchain
      SYSROOT="${CRAFT_STAGE}/microblaze-toolchain/${MB_PREFIX}/sysroot"
      if [ ! -d "$SYSROOT" ]; then
        # Try alternate location
        SYSROOT="${CRAFT_STAGE}/microblaze-toolchain/sysroot"
      fi

      echo "Using sysroot: $SYSROOT"

      # Build with our buildroot toolchain using full names and proper sysroot
      make COMPILER=${MB_PREFIX}-gcc \
           ARCHIVER=${MB_PREFIX}-ar \
           CC=${MB_PREFIX}-gcc \
           CFLAGS="-Os -flto --sysroot=${SYSROOT}" \
           -j$(nproc)

      # Verify the build output
      if [ ! -f executable.elf ]; then
        echo "ERROR: PMU firmware build failed - executable.elf not found"
        exit 1
      fi

      # Install the firmware
      install -D -m 0644 executable.elf ${CRAFT_PART_INSTALL}/blobs/pmufw.elf
      echo "PMU firmware built and installed successfully"
    # stage:
    #   - blobs/pmufw.elf
    prime:
      - -*
  arm-trusted-firmware:
    plugin: nil
    source: https://github.com/Xilinx/arm-trusted-firmware.git
    source-type: git
    source-tag: xlnx_rebase_v2.12_2025.1
    build-packages:
      - crossbuild-essential-arm64
    build-environment:
      - PLAT: 'zynqmp'
      - RESET_TO_BL31: '1'
      - RESET_TO_BL2: '0'
      - ZYNQMP_CONSOLE: 'cadence1'
      - PRELOADED_BL33_BASE: '0x8000000'
      - SPD: 'opteed'
    override-build: |
      make PLAT=${PLAT} \
        SPD=${SPD} \
        ZYNQMP_CONSOLE=${ZYNQMP_CONSOLE} \
        RESET_TO_BL31=${RESET_TO_BL31} \
        RESET_TO_BL2=${RESET_TO_BL2} \
        PRELOADED_BL33_BASE=${PRELOADED_BL33_BASE} \
        bl31 -j$(nproc)
      install -D -m 0644 build/${PLAT}/release/bl31/bl31.elf ${CRAFT_PART_INSTALL}/blobs/arm-trusted-firmware.elf
    stage:
      - blobs/arm-trusted-firmware.elf
    prime:
      - -*
  efi:
    plugin: nil
    source: efi
    build-packages:
      - ubuntu-core-initramfs
    override-build: |
      python3 ${CRAFT_PART_SRC}/make_ubootefi_var.py \
        --all /usr/lib/ubuntu-core-initramfs/snakeoil/PkKek-1-snakeoil.pem \
        -o ${CRAFT_PART_INSTALL}/ubootefi.var
    prime:
      - -*
  # optee-os:
  #   plugin: nil
  #   source: https://github.com/Xilinx/optee_os.git
  #   source-type: git
  #   source-tag: xlnx_rebase_v4.5.0_2025.1_update1
  #   override-pull: |
  #     craftctl default
  #     curl https://storage.googleapis.com/git-repo-downloads/repo > /bin/repo && chmod a+x /bin/repo
  #     repo init -u https://github.com/Xilinx/optee_manifest.git
  #     cp ${CRAFT_PROJECT_DIR}/optee_zynqmp.xml .repo/manifests/
  #     repo init -m optee_zynqmp.xml && repo sync -j$(nproc)
  #   build-packages:
  #     - python3-cryptography
  #     - python3-pyelftools
  #     - uuid-dev
  #   build-environment:
  #     - PLATFORM: zynqmp-zcu102
  #     - CFG_ARM64_core: y
  #     - CFG_RPMB_FS: n
  #     - CFG_TEE_CORE_LOG_LEVEL: '4'
  #     - CFG_TEE_TA_LOG_LEVEL: '4'
  #     - CFG_UART_BASE: 'UART1_BASE'
  #   override-build: |
  #     cd build
  #     make toolchains -j$(nproc)
  #     make optee-os -j$(nproc)
  #     install -D -m 0644 ${CRAFT_PART_BUILD}/optee_os/out/arm/core/tee.elf \
  #                        ${CRAFT_PART_INSTALL}/blobs/tee.elf
  #     install -D -m 0644 ${CRAFT_PART_BUILD}/optee_os/out/arm/core/tee-raw.bin \
  #                        ${CRAFT_PART_INSTALL}/blobs/tee.bin
  #   prime:
  #     - -*
  u-boot:
    after:
      - efi
    plugin: nil
    source: https://github.com/Xilinx/u-boot-xlnx.git
    source-branch: xlnx_rebase_v2025.01_update
    source-type: git
    build-packages:
      - crossbuild-essential-arm64
      - bc
      - bison
      - flex
      - swig
      - libgnutls28-dev
      - libssl-dev
      - device-tree-compiler
    build-environment:
      - ARCH: 'arm64'
      - CROSS_COMPILE: '${CRAFT_ARCH_TRIPLET_BUILD_FOR}-'
      # k26 kv device tree
      - DEVICE_TREE: 'zynqmp-smk-k26-revA-sck-kv-g-revB'
    override-pull: |
      craftctl default
      git apply ${CRAFT_PROJECT_DIR}/patches/0001-crypto-pkcs7_verify-drop-x509-signing-time-validity-check.patch
      git apply ${CRAFT_PROJECT_DIR}/patches/0002-efi_loader-accept-unsigned-inner-images.patch
      git apply ${CRAFT_PROJECT_DIR}/patches/9999-DEBUG-efi-auth-trace.patch
    override-build: |
      # Add custom version from snapcraft.yaml
      head=$(git rev-parse --verify --short HEAD 2> /dev/null)
      version=$(make ubootversion)

      # Enable EFI secure boot
      make xilinx_zynqmp_kria_defconfig
      ./scripts/config --enable CONFIG_EFI_SECURE_BOOT \
        --enable CONFIG_FIT_SIGNATURE \
        --enable CONFIG_EFI_VARIABLE_NO_STORE \
        --disable CONFIG_EFI_VARIABLE_FILE_STORE \
        --enable CONFIG_EFI_VARIABLES_PRESEED \
        --disable CONFIG_TPM_V1
      make olddefconfig

      # Copy certificate variables
      cp ${CRAFT_STAGE}/ubootefi.var ${CRAFT_PART_BUILD}/

      # Set custom version directly via LOCALVERSION
      make DEVICE_TREE=${DEVICE_TREE} \
           LOCALVERSION="-snap-${CRAFT_PROJECT_VERSION}[efi]" \
           -j$(nproc)
      install -D -m 0644 u-boot.elf ${CRAFT_PART_INSTALL}/blobs/u-boot.elf
    prime:
      - -*
  bootgen:
    plugin: nil
    source: https://github.com/Xilinx/bootgen.git
    source-type: git
    source-branch: xlnx_rel_v2025.1
    override-build: |
      make
      cp build/bin/bootgen $CRAFT_PART_INSTALL/bootgen
    prime:
      - -*
  boot-bin:
    after:
      - blobs
      - bootgen
      - fsbl
      - arm-trusted-firmware
      # - optee-os
      - u-boot
      - pmu-firmware
    plugin: dump
    source: .
    build-environment:
      - ARCH: 'zynqmp'
    override-build: |
      cp bootgen.bif ${CRAFT_STAGE}/
      cd ${CRAFT_STAGE}
      ./bootgen -w -image bootgen.bif -arch ${ARCH} -o ${CRAFT_PART_INSTALL}/BOOT.bin
    prime:
      - BOOT.bin
